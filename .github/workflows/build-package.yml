name: Build Julia for Termux

on:
  push:
    branches: [main]
    paths:
      - 'packages/julia/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 720  # 12h max — LLVM compilation is slow
    steps:
    - uses: actions/checkout@v4

    - name: Enable zram (16GB comprimido para builds grandes)
      uses: ./.github/actions/zram
      with:
        algorithm: zstd
        size: 16G
        priority: 100
        device_name: /dev/zram0

    - name: Restore build cache
      uses: actions/cache@v4
      id: build-cache
      with:
        path: ~/.termux-build
        key: julia-termux-${{ hashFiles('packages/julia/build.sh') }}-${{ github.run_id }}
        restore-keys: |
          julia-termux-${{ hashFiles('packages/julia/build.sh') }}-
          julia-termux-

    - name: Check cache state
      run: |
        echo "Cache size: $(du -sh ~/.termux-build 2>/dev/null | cut -f1 || echo '0')"
        echo "LLVM objects: $(find ~/.termux-build/julia/src/deps/scratch/llvm-julia-*/build_Release -name '*.o' 2>/dev/null | wc -l)"
        echo "srccache: $(du -sh ~/.termux-build/julia/src/deps/srccache 2>/dev/null | cut -f1 || echo '0')"

    - name: Verify Docker
      run: |
        docker version
        echo "Docker ready"

    - name: Setup termux-packages checkout
      run: |
        TP_DIR="$HOME/.cache/julia-termux/termux-packages"
        if [ ! -d "$TP_DIR/.git" ]; then
          echo "Cloning termux-packages..."
          git clone --depth=1 https://github.com/termux/termux-packages.git "$TP_DIR"
        else
          echo "termux-packages already cached"
        fi
        # Copy our build.sh into the termux-packages tree
        mkdir -p "$TP_DIR/packages/julia"
        cp packages/julia/build.sh "$TP_DIR/packages/julia/build.sh"
        chmod +x "$TP_DIR/packages/julia/build.sh"
        echo "build.sh copied to $TP_DIR/packages/julia/"

    - name: Fix cache permissions for Docker
      run: |
        mkdir -p ~/.termux-build
        chmod 777 ~/.termux-build

    - name: Build Julia via Docker
      run: |
        ./scripts/run-docker.sh bash -c '
          export TERMUX_PROOT_DISABLED=1
          /home/builder/julia-termux/scripts/patch-fuse-overlayfs.sh /home/builder/termux-packages || true
          cd /home/builder/termux-packages
          # Install build deps (Docker is Ubuntu, use apt not pkg)
          sudo apt-get update -qq && sudo apt-get install -yqq cmake ninja-build 2>/dev/null || true
          ./build-package.sh -I --format debian -j 2 -f julia
        '

    - name: Cleanup Docker container
      if: always()
      run: |
        docker rm -f julia-termux-builder 2>/dev/null || true

    - name: Debug - Show build log on failure
      if: failure()
      run: |
        echo "=== Build failed ==="
        ls -la ~/.termux-build/ 2>/dev/null || echo "No .termux-build dir"
        find ~/.termux-build -name "*.log" -o -name "*.err" 2>/dev/null | head -20
        echo "=== Last 50 lines of build log ==="
        find ~/.termux-build -name "*.log" -exec tail -50 {} \; 2>/dev/null | tail -100

    - name: Collect package files
      if: always()
      run: |
        mkdir -p ./artifacts
        # termux-packages output goes to $TERMUX_TOPDIR/output/ = ~/.termux-build/output/ on host
        for d in "$HOME/.termux-build/output" "$HOME/.cache/julia-termux/termux-packages/output" "./output"; do
          find "$d" -maxdepth 1 -type f \
            \( -name 'julia-*.deb' -o -name 'julia-*.pkg.tar.*' \) \
            -exec cp -f {} ./artifacts/ \; 2>/dev/null || true
        done
        echo "Artifacts:"
        ls -la ./artifacts/ 2>/dev/null || echo "(none)"

    - name: Upload to GitHub Release
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        FILE=$(ls ./artifacts/julia-*.deb ./artifacts/julia-*.pkg.tar.* 2>/dev/null | head -1)
        [ -f "$FILE" ] || exit 0
        gh release delete julia-latest --yes --cleanup-tag 2>/dev/null || true
        gh release create julia-latest "$FILE" \
          --repo "${{ github.repository }}" \
          --title "julia-latest" \
          --latest \
          --notes "Julia for Termux aarch64 - Build from ${{ github.sha }}"

    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: julia-aarch64-${{ github.sha }}
        path: ./artifacts/*
        if-no-files-found: warn
