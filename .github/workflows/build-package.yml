name: Build Julia for Termux

run-name: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') && 'Build and publish' || 'Build (no publish)' }}

# Architecture (October 2026): the build runs termux-packages in its own on-device
# mode on an arm64 runner, so host == target and Termux's clang is the compiler.
# That is what makes the bundled LLVM 18.1.7 buildable at all: the x86_64 Docker
# builder used to compile LLVM's host tools as aarch64 and die on
# `llvm-min-tblgen: Exec format error`, 60-76 minutes into every run.
#
# DAG: lint (static gate) -> build (.deb) -> bundle (.pkg.tar.xz + tar.gz) -> publish.
# Nothing expensive starts unless the gate passed; see AGENTS.md "no CI run without
# the local gate".  publish is opt-in (workflow_dispatch input) - a green run is not a
# reason to move a release pointer.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/build-package.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the bundle to the mutable julia-latest release (off by default: a green build is not the same claim as a published package)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PKG: julia
  ARCH: aarch64
  RECIPE: packages/julia/build.sh

jobs:
  lint:
    name: Static gate (no compilation)
    # The gate derives from base/Makefile which libraries julia-base will ask the
    # loader to resolve; the build job has no source tree at probe time, so it
    # probes the list the gate computed instead of a name list kept by hand.
    outputs:
      probe_libs: ${{ steps.libraries.outputs.probe_libs }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/termux-builder
        with:
          recipe: ${{ env.RECIPE }}

      - name: Shell syntax and style
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          for f in scripts/*.sh packages/*/*.sh; do
            if bash -n "$f"; then
              printf 'OK    %s\n' "$f"
            else
              printf 'FAIL  %s does not parse\n' "$f"
              fail=$((fail + 1))
            fi
          done
          bash scripts/lint-workflows.sh || fail=$((fail + 1))
          if ! command -v shellcheck > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y shellcheck
          fi
          # Errors are the gate.  Warning-level output is printed but not fatal:
          # recipes reference variables termux-packages defines (SC2154) and the
          # triage of that noise is not what a build run should test.
          if ! shellcheck -S error scripts/*.sh packages/*/*.sh; then
            printf 'FAIL  shellcheck reported errors\n'
            fail=$((fail + 1))
          fi
          shellcheck -S warning -f gcc scripts/*.sh packages/*/*.sh \
            | sed 's/^/  advisory: /' | head -40 || true
          exit "$fail"

      - name: Rehearse the recipe against the pinned sources
        shell: bash
        run: |
          set -uo pipefail
          . "$TERMUX_BUILDER_ENV"
          # The gate replays termux_step_patch_package() and the recipe's configure
          # hooks over the real Julia tarball, probes every USE_SYSTEM_* flag
          # against this prefix, and builds the pinned libwhich to ask it the same
          # question base/Makefile will ask at julia-base time.
          export REHEARSAL_CACHE="$RUNNER_TEMP/rehearse-cache"
          export REHEARSAL_LIBS_OUT="$RUNNER_TEMP/symlinked-libs.txt"
          bash scripts/rehearse-recipe.sh "$PKG"

      - name: Hand the derived library list to the build job
        id: libraries
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -s "$RUNNER_TEMP/symlinked-libs.txt" ]; then
            echo "the gate wrote no library list, so julia-base's lookups are unchecked" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "no list derived from base/Makefile" >&2
            exit 1
          fi
          # paste, not tr: tr leaves the last line's separator behind as a
          # trailing space and the anchored check below rightly rejects it
          # (run 37833826111 - the gate passed, this handoff killed the job).
          list=$(paste -sd' ' "$RUNNER_TEMP/symlinked-libs.txt")
          if ! printf '%s' "$list" | grep -Eq '^[A-Za-z0-9_.+-]+( [A-Za-z0-9_.+-]+)*$'; then
            echo "the derived list holds characters that are not library names" >&2
            exit 1
          fi
          printf 'probe_libs=%s\n' "$list" >> "$GITHUB_OUTPUT"
          echo "derived: $list"

      - name: Record the verdict
        if: always()
        shell: bash
        run: |
          echo "gate ran on $(uname -m) with $(nproc) cores; the GATE line of the" \
            "previous step is the verdict" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build julia .deb (native bionic, on-device mode)
    needs: lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/termux-builder
        with:
          recipe: ${{ env.RECIPE }}

      # `JULIA_PRECOMPILE := 1` (packages/julia/build.sh:134) starts one julia per
      # TERMUX_PKG_MAKE_PROCESSES, so the stage this port has never reached is the
      # one most likely to be limited by memory rather than by correctness.
      # Compressed RAM is the cheapest headroom available without changing the
      # build: run 37870492832 measured the runner at 15 947 MB of RAM with a
      # 3 071 MB swap that had 0 MB used at rest, so the disk-backed swap already
      # there is not what a page-fault storm can live on.  It is deliberately not
      # allowed to cost a run: a runner kernel that refuses an out-of-tree zram.ko
      # must leave the job building on plain RAM, which is what it did before.
      - name: Add compressed swap to the runner
        uses: ./.github/actions/zram
        continue-on-error: true

      # The same measurement question as the step above, answered in advance:
      # bionic's scudo reserves a region per size class, and the refusing message
      # is identical whether the kernel ran out of RAM or out of VMAs.  The
      # runner's own limit is printed by the `before:` line below and reported
      # again on failure, because /proc/sys/vm/max_map_count is not readable from
      # the phone to compare.  Raising it costs nothing and cannot change the code
      # being built.
      - name: Raise the runner's mapping limit
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "before: $(cat /proc/sys/vm/max_map_count)"
          sudo sysctl -w vm.max_map_count=1048576
          echo "after:  $(cat /proc/sys/vm/max_map_count)"

      - name: Report what the build will really have
        shell: bash
        run: |
          set -uo pipefail
          free -m
          swapon --show || echo "no swap device"

      - name: Clone termux-packages and stage the recipe
        id: tp
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/termux/termux-packages "$RUNNER_TEMP/tp"
          tp_sha=$(git -C "$RUNNER_TEMP/tp" rev-parse HEAD)
          echo "sha=$tp_sha" >> "$GITHUB_OUTPUT"
          # The whole package directory, not just build.sh: the *.patch files next to
          # the recipe are what termux_step_patch_package() consumes.
          rm -rf "$RUNNER_TEMP/tp/packages/$PKG"
          cp -a "packages/$PKG" "$RUNNER_TEMP/tp/packages/$PKG"
          test -f "$RUNNER_TEMP/tp/packages/$PKG/build.sh"
          # The juliac launcher lives outside packages/$PKG so that editing it does not
          # change the cache key below, which is the whole point of keeping it apart.
          # The recipe installs it from its sibling directory.
          rm -rf "$RUNNER_TEMP/tp/packages/juliac"
          cp -a packages/juliac "$RUNNER_TEMP/tp/packages/juliac"
          test -f "$RUNNER_TEMP/tp/packages/juliac/juliac"
          echo "staged $(find "$RUNNER_TEMP/tp/packages/$PKG" -name '*.patch' | wc -l) patch files"
          # A bump of any library in the Termux repository changes the binary we
          # produce, so the repository state belongs in the cache key.  The bootstrap
          # index the action fetched is the cheapest fingerprint of it.
          repo_stamp=$(sha256sum "$RUNNER_TEMP/Packages" | cut -c 1-16)
          echo "repo_stamp=$repo_stamp" >> "$GITHUB_OUTPUT"

      # Cache contract: what is cached is the *artifact*, keyed by everything that
      # feeds into it (termux-packages commit, repository state, recipe + patches).
      # The build tree itself is deliberately not cached: termux-packages deletes
      # $TERMUX_PKG_SRCDIR at the start of every build (scripts/build/
      # termux_step_setup_build_folders.sh:20, reached from termux_step_start_build
      # because only -c skips it), and with -c the packaging would then sweep only
      # the files newer than its fresh timestamp file.  A rebuilt artifact is the
      # honest result; the artifact cache is what makes a repeat of an unchanged
      # recipe free.
      #
      # The recipe hash is the FIRST key component so `restore-keys` can reuse the
      # last artifact built from the same recipe when only scripts/**, .github/**,
      # docs or PROGRESS.md changed.  With the termux-packages commit and the
      # Termux index hash ahead of it, a one-line fix to scripts/make-pacman-pkg.sh
      # was about to pay another full ~60 min build (run 37939888448), because
      # those two components drift on their own within hours.  The strict key is
      # still what gets saved, so the entry records the environment it was built
      # in; a restore-keys hit is deliberately NOT re-saved under a different one.
      - name: Restore the artifact cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: output
          key: julia-deb-v2-aarch64-${{ hashFiles('packages/julia/**') }}-${{ steps.tp.outputs.sha }}-${{ steps.tp.outputs.repo_stamp }}
          restore-keys: |
            julia-deb-v2-aarch64-${{ hashFiles('packages/julia/**') }}-

      # The juliac half of the CI, and the reason the launcher does not live under
      # packages/julia/: the cache key is hashFiles('packages/julia/**'), so a cache
      # hit can carry the previous launcher.  Re-install the current one and rebuild
      # the .deb around it, and editing the launcher costs this run instead of a
      # ~65-minute recompile.  dpkg-deb -R/-b is a round trip; the payload's 0700
      # modes are kept and Installed-Size is recomputed so the control file stays
      # true.  The inspection below then compares the shipped file with the source,
      # so the two can never drift.
      - name: Install the juliac launcher from its own source
        if: steps.cache.outputs.cache-matched-key != ''
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          DEB=$(ls output/julia_*_aarch64.deb 2>/dev/null || true)
          [ -n "$DEB" ] || { echo "the restored cache holds no julia .deb"; exit 1; }
          P=data/data/com.termux/files/usr
          W=$(mktemp -d "$RUNNER_TEMP/repack.XXXXXX")
          dpkg-deb -R "$DEB" "$W"
          was=$(sha256sum "$W/$P/bin/juliac" 2>/dev/null | cut -d' ' -f1 || echo absent)
          install -m 700 packages/juliac/juliac "$W/$P/bin/juliac"
          size=$(du -sk "$W/data" | cut -f1)
          sed -i "s/^Installed-Size: .*/Installed-Size: $size/" "$W/DEBIAN/control"
          dpkg-deb -b "$W" "$DEB"
          rm -rf "$W"
          now=$(sha256sum packages/juliac/juliac | cut -d' ' -f1)
          echo "launcher in the restored .deb: $was"
          echo "launcher installed now:        $now"
          [ "$was" = "$now" ] || echo "(the cached artifact carried a different launcher - that is what this step is for)"
          dpkg-deb -I "$DEB" | grep -E 'Installed-Size|Package:|Version:'

      - name: Probe the loader's library resolution
        if: steps.cache.outputs.cache-matched-key == ''
        shell: bash
        env:
          PROBE_LIBS: ${{ needs.lint.outputs.probe_libs }}
        run: |
          set -uo pipefail
          . "$TERMUX_BUILDER_ENV"
          # The gate's "library resolution" section measured this in the lint
          # job's environment; this repeats it in the build job's own, in the
          # exact environment base/Makefile will ask libwhich for these names.
          # The names come from the gate's derivation, because this job has no
          # source tree yet and a list invented here is what let the libblas.so
          # failure reach a build (run 37823556050).
          bash scripts/probe-library-resolution.sh

      - name: Build the package
        if: steps.cache.outputs.cache-matched-key == ''
        shell: bash
        run: |
          set +e
          set -uo pipefail
          . "$TERMUX_BUILDER_ENV"
          cd "$RUNNER_TEMP/tp"
          mkdir -p "$GITHUB_WORKSPACE/output"
          # -s: the prefix already holds the recipe's DEPENDS and BUILD_DEPENDS
          #     (installed by the action), so no dependency resolution is needed -
          #     and without it a failed download would silently start building
          #     dependencies from source.
          # No -c and no -f: see the cache contract above.
          # Start the build from the prefix's own bash, not from this step's shell.
          # build-package.sh begins with `#!/bin/bash`, and the shell that gets here
          # is the runner's glibc bash with bionic's libtermux-exec only in the
          # environment - so the kernel would exec a glibc /bin/bash carrying that
          # preload and its loader dies on "invalid ELF header" without printing a
          # line (run 37789690789).  Run by the prefix's bash the preload is real,
          # and the FHS paths termux-packages and Julia's makefiles assume
          # (/bin/sh, /usr/bin/env perl) resolve into the prefix like they do on a
          # phone.
          printf '%s\n' \
            '#!/data/data/com.termux/files/usr/bin/bash' \
            'set -uo pipefail' \
            'cd "$RUNNER_TEMP/tp" || exit 1' \
            './build-package.sh -s --format debian -j "$(nproc)" \' \
            '  -o "$GITHUB_WORKSPACE/output" "$PKG"' \
            > "$RUNNER_TEMP/run-build.sh"
          chmod 755 "$RUNNER_TEMP/run-build.sh"
          # Run 37870492832 loaded Base and the stdlibs in 54 s and then died
          # emitting sysbase-o.a: scudo refused pages, LLVM threw std::bad_alloc
          # and the process took SIGABRT - with no `Killed` line, so the kernel's
          # OOM killer is not what stopped it.  Whether the refusal came from RAM,
          # from the address-space/VMA limit or from an overcommit heuristic
          # decides the fix, and the difference is not visible in the build log, so
          # sample it while the build runs.  `pgrep -x`, never `-f`: the sampler
          # must not match this shell.
          : > "$RUNNER_TEMP/memwatch.log"
          while :; do
            {
              date -u '+%FT%TZ'
              grep -E 'MemAvailable|Committed_AS|CommitLimit|SwapTotal|Writeback' /proc/meminfo
              ps -eo pid,rss,comm --sort=-rss | sed -n '2,4p'
              for p in $(pgrep -x julia | head -3); do
                printf 'julia pid=%s vmas=%s rss=%skB\n' "$p" \
                  "$(wc -l < "/proc/$p/maps" 2>/dev/null)" \
                  "$(awk '/VmRSS/{print $2}' "/proc/$p/status" 2>/dev/null)"
              done
              echo '---'
            } >> "$RUNNER_TEMP/memwatch.log" 2>/dev/null
            sleep 20
          done &
          watch_pid=$!
          "$RUNNER_TEMP/run-build.sh" 2>&1 |
            tee "$RUNNER_TEMP/build.log" |
            grep -vE 'linkerconfig|ld.config.txt'
          rc=${PIPESTATUS[0]}
          kill "$watch_pid" 2>/dev/null || true
          echo "build rc=$rc"
          ls -l "$GITHUB_WORKSPACE/output"
          exit "$rc"

      - name: Report what stopped the build
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # This step runs on failure too: the failure is the reason for the
          # question.  It only reads what the sampler left behind, and a report is
          # not allowed to cost the run - the runner starts the block with -e, so
          # every read that can legitimately find nothing is answered here.  Run
          # 37876520515: 'grep -h ^julia pid=' matched nothing because the sampler
          # never saw a julia process, and that killed the step that was supposed
          # to say so.
          watch="$RUNNER_TEMP/memwatch.log"
          if [ -s "$watch" ]; then
            echo "samples: $(grep -c -- '---' "$watch" || true)  (taken 20 s apart)"
            echo "lowest MemAvailable observed (kB): $(awk '/MemAvailable/ {print $2}' "$watch" | sort -n | head -1 || true)"
            echo "largest julia observed:"
            grep -h '^julia pid=' "$watch" | sort -t= -k4 -n -r | head -3 ||
              echo "  the sampler never saw a julia process run"
            echo "tail of the samples:"
            tail -12 "$watch"
          else
            echo "no memory samples were taken (cache hit, or the build step did not run)"
          fi
          echo "vm.max_map_count = $(cat /proc/sys/vm/max_map_count 2>/dev/null || echo unreadable)"
          echo "ulimit -v        = $(ulimit -v)"
          echo "=== the kernel's account (empty output is itself a result) ==="
          sudo dmesg | tail -80 |
            grep -iE 'oom|out of memory|killed process|mmap|vmalloc' ||
            echo "no OOM line in dmesg"

      - name: Inspect the artifact
        shell: bash
        run: |
          set -euo pipefail
          . "$TERMUX_BUILDER_ENV"
          cd "$GITHUB_WORKSPACE"
          DEB=$(ls output/julia_*_aarch64.deb 2>/dev/null | head -1)
          if [ -z "${DEB:-}" ]; then
            echo "no julia .deb in output/ - the build did not produce an artifact"
            exit 1
          fi
          dpkg-deb -I "$DEB"
          rm -rf unpack && mkdir -p unpack
          dpkg-deb -x "$DEB" unpack
          P=unpack/data/data/com.termux/files/usr
          fail=0
          # The launcher is the one artefact here whose source lives outside the
          # recipe, so nothing else would notice drift between the two.
          if cmp -s packages/juliac/juliac "$P/bin/juliac"; then
            printf 'OK    bin/juliac is byte-for-byte packages/juliac/juliac\n'
          else
            printf 'FAIL  bin/juliac differs from packages/juliac/juliac\n'; fail=1
          fi
          for f in "$P/bin/julia" "$P"/lib/julia/sys.so "$P"/lib/julia/libblastrampoline.so*; do
            if [ -e "$f" ]; then printf 'OK    %s\n' "${f#"$P"/}"
            else printf 'FAIL  %s absent from the package\n' "${f#"$P"/}"; fail=1; fi
          done
          # The other half of the pre-massage contract: nothing that is not Julia's.
          # An on-device build packages whatever was newer than its start timestamp, so
          # a phone that wrote a log during the build would ship that log.  The names
          # allowed here are exactly the ones termux_step_pre_massage() keeps, so a
          # change to that hook has to show up here as well or this check goes red.
          printf -- '--- payload outside Julia footprint ---\n'
          _foreign() { # <dir> [allowed name ...]
            local _d="$1" _n _expr
            shift
            if [ ! -d "$_d" ]; then
              # An expected directory missing from the payload means the find below
              # would check nothing at all, so say so instead of passing quietly.
              [ -e "$_d" ] && printf 'FAIL  foreign: %s (not a directory)\n' "$_d"
              return 0
            fi
            _expr=("$_d" -mindepth 1 -maxdepth 1)
            for _n in "$@"; do _expr+=( ! -name "$_n" ); done
            find "${_expr[@]}" -printf 'FAIL  foreign: %p\n'
          }
          _left=$(
            _foreign unpack data
            _foreign unpack/data data
            _foreign unpack/data/data/com.termux/files usr
            _foreign "$P" bin etc include lib libexec share
            _foreign "$P/bin" julia 'julia-*' juliac
            _foreign "$P/etc" julia
            _foreign "$P/include" julia
            _foreign "$P/lib" julia 'libjulia*' 'libopenlibm*'
            _foreign "$P/libexec" julia
            _foreign "$P/share" julia doc man metainfo applications
            _foreign "$P/share/doc" julia
            _foreign "$P/share/man" man1
            _foreign "$P/share/man/man1" 'julia*'
            _foreign "$P/share/metainfo" 'julia*'
            _foreign "$P/share/applications" 'julia*'
          )
          if [ -n "$_left" ]; then
            printf '%s\n' "$_left"
            fail=1
          else
            echo "OK    nothing in the payload outside Julia's footprint"
          fi
          printf -- '--- bin/julia: target and dynamic section ---\n'
          file "$P/bin/julia"
          readelf -h "$P/bin/julia" | grep -E 'Class|Machine|Type'
          readelf -d "$P/bin/julia" | grep -E 'RUNPATH|RPATH' || {
            echo "FAIL  no RUNPATH: Julia's stdlibs would not find \$PREFIX/lib/julia"; fail=1; }
          # Not `| grep -q` under this step's `set -euo pipefail`: grep -q
          # leaves at the first match, the producer takes SIGPIPE, pipefail
          # reports 141 and `if` reads that as "absent" - a real TEXTREL would
          # pass silently.  Test the captured output instead (the same defect
          # the recipe's LLVM assertion had, run 37904805726).
          _dyn=$(readelf -d "$P/bin/julia" 2>&1 || true)
          case "${_dyn}" in
            *TEXTREL*) echo "FAIL  DT_TEXTREL: Android's linker rejects this"; fail=1 ;;
          esac
          printf -- '--- NEEDED of the codegen library ---\n'
          CG=$(ls "$P"/lib/julia/libjulia-codegen.so* 2>/dev/null | head -1)
          if [ -n "$CG" ]; then
            _dyncg=$(readelf -d "$CG" 2>&1 || true)
            printf '%s\n' "${_dyncg}" | grep NEEDED || echo "  (no NEEDED entries)"
            case "${_dyncg}" in
              *libLLVM-21*) echo "FAIL  linked against Termux's LLVM 21; Julia 1.12 needs its own 18.1.7"; fail=1 ;;
            esac
          else
            echo "FAIL  no libjulia-codegen.so in the package"; fail=1
          fi
          printf -- '--- LLVM symbol version (Julia expects JL_LLVM_18.1) ---\n'
          LL=$(ls "$P"/lib/julia/libLLVM-18jl.so* 2>/dev/null | head -1)
          if [ -n "$LL" ]; then
            _symvers=$(readelf -V "$LL" 2>&1 || true)
            case "${_symvers}" in
              *JL_LLVM_18.1*) echo "  symvers: JL_LLVM_18.1 present" ;;
              *) echo "  FAIL  the packaged libLLVM-18jl.so lacks JL_LLVM_18.1"; fail=1 ;;
            esac
          else
            echo "WARN  libLLVM-18jl.so not in the package (was it linked statically?)"
          fi
          printf -- '--- payload ---\n'
          du -sh "$P" | sed 's/^/  /'
          find unpack -name '*.so*' | wc -l | sed 's/^/  shared objects: /'
          exit "$fail"

      # The juliac half again, this time doing the thing the port ships it for: a
      # program compiled with the supported --trim=safe, and the binary running.  It
      # runs against the .deb - what ships, cached or freshly built - and not the
      # build tree, so it stays true on a cache hit.  It is what would have caught the
      # OpenBLAS soname regression in CI instead of on the device.
      - name: juliac compiles with --trim=safe
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          DEB=$(ls output/julia_*_aarch64.deb 2>/dev/null || true)
          [ -n "$DEB" ] || { echo "no julia .deb to check"; exit 1; }
          # PATH and TMPDIR only, and $PREFIX (the value the action publishes in
          # GITHUB_ENV) rather than the sourced env file's TERMUX_PREFIX: not sourcing
          # that file is deliberate, LD_PRELOAD would rewrite /usr/bin/git into the
          # prefix's bionic git, which has no DNS.
          export PATH="$PREFIX/bin:$PATH" TMPDIR="$PREFIX/tmp"
          dpkg-deb -x "$DEB" /
          # juliac's first act is Pkg.precompile(), and Pkg answers a depot with no
          # registry by installing one; bionic has no DNS on these runners, so the
          # registry comes from the host's git.  It is never searched - the environment
          # has no packages - it only has to be present.
          if [ ! -d "$HOME/.julia/registries/General" ]; then
            mkdir -p "$HOME/.julia/registries"
            /usr/bin/git clone --depth 1 --quiet \
              https://github.com/JuliaRegistries/General.git \
              "$HOME/.julia/registries/General"
          fi
          W=$(mktemp -d "$RUNNER_TEMP/juliac-check.XXXXXX")
          # Dispatch-free on purpose: `print` goes through Any and the trim verifier
          # refuses it, so the program writes with ccall.  See PROGRESS.md.
          printf '%s\n' \
            'function (@main)(args::Vector{String})' \
            '    ccall(:write, Cint, (Cint, Ptr{UInt8}, Csize_t), 1, "juliac ok", 9)' \
            '    return Cint(0)' \
            'end' > "$W/hello.jl"
          ( cd "$W" && JULIA_PKG_OFFLINE=true \
              "$PREFIX/bin/juliac" --experimental --trim=safe --output-exe hello hello.jl )
          out=$("$W/hello")
          [ "$out" = "juliac ok" ] || { echo "the trimmed binary printed: [$out]"; exit 1; }
          echo "juliac --trim=safe built a $(stat -c %s "$W/hello") byte binary and it ran"

      - name: Save the artifact cache
        if: success() && steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: output
          key: julia-deb-v2-aarch64-${{ hashFiles('packages/julia/**') }}-${{ steps.tp.outputs.sha }}-${{ steps.tp.outputs.repo_stamp }}

      - name: Where the time went
        if: always()
        shell: bash
        run: |
          # Report only, never a verdict: with -e this step turned the job red for
          # `du` on a directory the failed build had not created (run 37789690789).
          set +e
          set -uo pipefail
          LOG="$RUNNER_TEMP/build.log"
          if [ ! -f "$LOG" ]; then
            echo "## Build log"
            echo "no build.log: the artifact cache supplied output/julia_*.deb" \
              "and the build step was skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Build log"
            echo "- size: $(du -h "$LOG" | cut -f1), $(wc -l < "$LOG") lines"
            echo "- first errors:"
            grep -nE 'error:|Error [0-9]|Killed|cannot find|No such file|undefined reference' \
              "$LOG" | head -10 | sed 's/^/      /'
            echo "- largest build directories:"
            du -sh "$HOME/.termux-build" 2>/dev/null | sed 's/^/      /'
            du -sh "$HOME"/.termux-build/*/src/deps/scratch/* \
              "$HOME"/.termux-build/*/src/usr/* 2>/dev/null | sort -h | tail -8 | sed 's/^/      /'
            echo "- last 60 lines:"
            grep -vE 'linkerconfig|ld.config.txt' "$LOG" | tail -60 | sed 's/^/      /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Upload the artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: julia-deb
          path: output/julia_*_aarch64.deb
          if-no-files-found: error

  bundle:
    name: Repackage for pacman and bundle
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: julia-deb
          path: incoming

      - name: Build the distributable set
        shell: bash
        run: |
          set -euo pipefail
          command -v bsdtar > /dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -qq -y libarchive-tools
          }
          DEB=$(ls incoming/julia_*_aarch64.deb)
          echo "input: $DEB"
          mkdir -p bundle
          cp "$DEB" bundle/
          bash scripts/make-pacman-pkg.sh "$DEB" bundle
          ( cd bundle && tar -czf julia-termux-aarch64.tar.gz \
              "$(basename "$DEB")" julia-*.pkg.tar.xz )
          ( cd bundle && sha256sum * > SHA256SUMS.txt )
          ls -l bundle
          cat bundle/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the bundle is self-consistent
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/bundle"
          sha256sum -c SHA256SUMS.txt
          # The two formats must carry the same bytes; compare the payload file lists.
          dpkg-deb -x julia_*_aarch64.deb "$RUNNER_TEMP/debx"
          mkdir -p "$RUNNER_TEMP/pacx"
          tar -xf julia-*.pkg.tar.xz -C "$RUNNER_TEMP/pacx"
          diff <(cd "$RUNNER_TEMP/debx" && find . | sort) \
               <(cd "$RUNNER_TEMP/pacx" && find . -not -name '.PKGINFO' \
                   -and -not -name '.BUILDINFO' -and -not -name '.MTREE' | sort)
          echo "payload identical between .deb and .pkg.tar.xz"

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: julia-termux-bundle
          path: bundle
          if-no-files-found: error

  publish:
    name: Publish the mutable release
    needs: bundle
    # `github.event.inputs` rather than `inputs`: this job also runs for push events,
    # where the dispatch inputs do not exist at all.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: julia-termux-bundle
          path: bundle

      - name: Upload to the julia-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job never checks the repo out - it only downloads the bundle - so
          # `gh` cannot infer the repository from a git remote and dies with
          # `failed to run git: fatal: not a git repository` (run 38011837174).
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd bundle
          [ -s SHA256SUMS.txt ]
          ls julia_*_aarch64.deb julia-*.pkg.tar.xz julia-termux-aarch64.tar.gz
          cat > notes.md <<EOF
          Built by run $RUN_ID at $COMMIT, in termux-packages' own on-device mode on an
          arm64 runner.

          Install the format your Termux uses:

              dpkg -i julia_*_aarch64.deb        # apt-based Termux
              pacman -U julia-*.pkg.tar.xz       # pacman-based Termux

          Check the bytes first: sha256sum -c SHA256SUMS.txt.

          A green run here means the artifact was built and inspected, not that it works
          on a phone: run scripts/device-smoke.sh on the device for that.
          EOF
          gh release delete julia-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create julia-latest \
            julia_*_aarch64.deb julia-*.pkg.tar.xz \
            julia-termux-aarch64.tar.gz SHA256SUMS.txt notes.md \
            --title "Julia 1.12.6 for Termux (aarch64)" \
            --latest \
            --notes-file notes.md
