name: probe-ondevice-builder

# Third and last feasibility probe.  probe-bionic-exec showed bionic/aarch64 ELFs run
# on ubuntu-24.04-arm; probe-native-termux showed Termux's clang can compile and link
# there.  This one asks the decisive question: can termux-packages' own build system,
# in its on-device mode, build a real package inside a Termux rootfs materialised on a
# Linux arm64 runner?  If yes, the Julia/LLVM builds in CI use exactly the code path
# that already works on the phone.  Test subject is a small real package, not Julia.
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ROOT: /data/data/com.termux/files/usr

jobs:
  builder:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Materialise the Android runtime
        run: |
          set -euo pipefail
          git fetch --depth 1 origin ci/probe-rootfs
          git show FETCH_HEAD:ci-probe-rootfs.tar.gz > rootfs.tar.gz
          echo "1f2e6ab823955f2220561191b2bfe1715b84b8fdc8ed5c7e7d9b20cc690fd746  rootfs.tar.gz" | sha256sum -c -
          sudo tar -xzf rootfs.tar.gz -C / system
          # build-package.sh enables TERMUX_ON_DEVICE_BUILD when this file exists
          sudo touch /system/bin/app_process
          sudo chmod -R a+rX /system
          ls -l /system/bin | head -5

      - name: Resolve the build environment closure
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.gz \
            -o Packages.gz
          gzip -dc Packages.gz > Packages
          # `set -e` would abort before the resolver's own report; print it either way.
          python3 .github/scripts/termux-closure-resolver.py Packages \
            clang lld llvm libllvm libcompiler-rt ndk-sysroot binutils llvm-tools \
            libc++ libandroid-support termux-exec dpkg apt termux-keyring gpgv \
            termux-elf-cleaner termux-tools make cmake ninja pkg-config \
            perl python git patch sed grep findutils diffutils tar gzip bzip2 xz-utils \
            lzip unzip which file jq ca-certificates openssl zlib zstd liblzma libexpat \
            libiconv ncurses pcre2 autoconf automake libtool m4 bison flex gettext \
            bsdtar uuid-utils > urls.txt 2> resolver.log
          rc=$?
          cat resolver.log
          wc -l < urls.txt
          exit $rc

      - name: Install the closure into the prefix
        run: |
          set -euo pipefail
          base=https://packages.termux.dev/apt/termux-main
          mkdir -p debs
          while read -r path; do
            curl --fail --silent --show-error --location --retry 3 "$base/$path" -o "debs/$(basename "$path")"
          done < urls.txt
          du -sh debs
          sudo mkdir -p "$ROOT"
          for f in debs/*.deb; do sudo dpkg-deb -x "$f" /; done
          # Record what we extracted as installed packages.  Without a dpkg
          # database build-package.sh's on-device path dies immediately: it calls
          # `apt install -y termux-elf-cleaner` (termux_step_start_build.sh:124),
          # and apt on an unprovisioned prefix returns 100.
          sudo mkdir -p "$ROOT/var/lib/dpkg" "$ROOT/tmp" "$ROOT/etc/apt"
          # apt's own state, created BEFORE the chown so the runner user owns it:
          # it refused to run over "Could not open lock file .../lists/lock
          # (13: Permission denied)" when these arrived from sudo mkdir.
          # /data/data/com.termux/cache is where Termux's apt puts its archives.
          sudo mkdir -p "$ROOT/var/lib/apt/lists/partial" "$ROOT/var/lib/apt/extended_states.d" \
            "$ROOT/etc/apt/apt.conf.d" "$ROOT/etc/apt/preferences.d" \
            /data/data/com.termux/cache/apt/archives/partial
          : > status.part
          for f in debs/*.deb; do
            d=$(mktemp -d)
            dpkg-deb -e "$f" "$d"
            # dpkg needs an explicit Status field; the control member has none.
            { echo 'Status: install ok installed'; cat "$d/control"; echo; } >> status.part
            rm -rf "$d"
          done
          grep -c '^Package: ' status.part
          sudo tee -a "$ROOT/var/lib/dpkg/status" > /dev/null < status.part
          sudo chmod 1777 "$ROOT/tmp"
          sudo chown -R "$(id -u):$(id -g)" /data "$ROOT"
          sudo chmod -R a+rX /data
          ls -l "$ROOT/bin/clang" "$ROOT/bin/termux-elf-cleaner" "$ROOT/lib/libtermux-exec.so" | head -4

      - name: Check that apt is usable in the materialised prefix
        run: |
          set -uo pipefail
          export LD_PRELOAD="$ROOT/lib/libtermux-exec.so"
          export PATH="$ROOT/bin:$PATH" TMPDIR="$ROOT/tmp"
          echo "--- sources shipped by the apt package ---"
          cat "$ROOT/etc/apt/sources.list"
          ls -l "$ROOT/etc/apt/trusted.gpg.d" | head -5
          # The shipped default uses packages-cf.termux.dev, whose AAAA record is served over
          # IPv6; these runners resolve IPv4 only, so apt gets "No address associated with
          # hostname" and every `apt install` inside build-package.sh dies with code 100.
          echo 'deb [trusted=yes] https://packages.termux.dev/apt/termux-main stable main' | sudo tee "$ROOT/etc/apt/sources.list" > /dev/null
          printf 'Acquire::ForceIPv4 "true";\n' | sudo tee "$ROOT/etc/apt/apt.conf.d/99force-ipv4" > /dev/null
          rc=0
          apt update >../apt-update.log 2>&1 || rc=$?
          echo "apt update rc=$rc"
          grep -vE 'linkerconfig|ld.config.txt' ../apt-update.log | tail -15
          # The exact call termux_step_start_build.sh makes on the device path.
          rc=0
          apt install -y --allow-unauthenticated termux-elf-cleaner >../apt-install.log 2>&1 || rc=$?
          echo "apt install termux-elf-cleaner rc=$rc"
          grep -vE 'linkerconfig|ld.config.txt' ../apt-install.log | tail -12
          command -v termux-elf-cleaner || echo "termux-elf-cleaner still missing"

      - name: Environment sanity
        run: |
          set -uo pipefail
          export LD_PRELOAD="$ROOT/lib/libtermux-exec.so"
          export PATH="$ROOT/bin:$PATH" TMPDIR="$ROOT/tmp"
          export TERMUX_APP_PACKAGE_MANAGER=apt
          if [ ! -f "$ROOT/bin/termux-setup-package-manager" ]; then
            printf '#!/data/data/com.termux/files/usr/bin/bash\nexport TERMUX_APP_PACKAGE_MANAGER=apt\n' > "$ROOT/bin/termux-setup-package-manager"
          fi
          chmod +x "$ROOT/bin/termux-setup-package-manager"
          echo "uname -o: $(uname -o)  app_process: $([ -e /system/bin/app_process ] && echo yes || echo no)"
          echo "id -u: $(id -u)  (the builder refuses root)"
          echo "dpkg arch: $("$ROOT/bin/dpkg" --print-architecture)"
          for t in clang ld.lld make cmake ninja pkg-config perl python git patch sed grep dpkg-deb file tar; do
            printf '%-12s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done

      - name: Clone termux-packages
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/termux/termux-packages tp

      - name: Build a real package with the on-device code path
        run: |
          set -uo pipefail
          export LD_PRELOAD="$ROOT/lib/libtermux-exec.so"
          export PATH="$ROOT/bin:$PATH" TMPDIR="$ROOT/tmp"
          export TERMUX_APP_PACKAGE_MANAGER=apt
          cd tp
          # -s: our materialised prefix has an empty dpkg status, so the dependency
          #     check would fail on packages that are actually present as files.
          # GitHub runs this with `bash -e`, so capture rc instead of letting a
          # non-zero build abort the step before the log is printed.
          rc=0
          # -f: libandroid-glob arrives as a dependency of something in the closure, so
          # without it the builder prints "installed - skipping" and exits 0 without
          # compiling.  Forcing is what makes this actually exercise the compile path.
          timeout 1500 ./build-package.sh -s -f --format debian -o ../output libandroid-glob >../build.log 2>&1 || rc=$?
          echo "build rc=$rc"
          # Every bionic exec on a Linux kernel prints this; it hides real output.
          clean() { grep -vE 'linkerconfig|ld.config.txt' "$1"; }
          echo "--- build.log: first 40 ---"
          clean ../build.log | head -40
          echo "--- build.log: last 40 ---"
          clean ../build.log | tail -40
          echo "--- error-looking lines ---"
          clean ../build.log | grep -nE 'ERROR|error_exit|No such file|not supported|not found|command not found|E: ' | head -20
          echo "--- output dir ---"
          ls -l ../output 2>/dev/null | head -10
          for f in ../output/*.deb; do
            [ -e "$f" ] || continue
            echo "--- $(basename "$f") ---"
            dpkg-deb -I "$f" | head -14
            dpkg-deb -x "$f" ../unpacked
            (cd ../unpacked && find . \( -name '*.so*' \) | head)
            ELF=$(cd ../unpacked && find . -type f -name '*.so*' | head -1)
            [ -n "$ELF" ] || continue
            echo "--- readelf of $ELF ---"
            readelf -h "../unpacked/$ELF" | grep -E 'Class|Machine|Type'
            readelf -d "../unpacked/$ELF" | grep -E 'RUNPATH|RPATH|TEXTREL' || echo "  (no RUNPATH/RPATH/TEXTREL)"
          done
          # Without this the job reports success while the build failed: every
          # command here ends in `|| rc=$?` or a grep, so the step status is
          # meaningless.  The deb is the only thing that proves the path works.
          if [ "$rc" -ne 0 ] || ! ls ../output/libandroid-glob_*_aarch64.deb >/dev/null 2>&1; then
            echo "GATE FAIL: build rc=$rc and no libandroid-glob deb in ../output"
            exit 1
          fi
          echo "GATE PASS: on-device build produced $(ls ../output/libandroid-glob_*_aarch64.deb)"

      - name: Record what the runner gave us
        if: always()
        run: |
          set -uo pipefail
          {
            echo "machine: $(uname -m)  nproc: $(nproc)"
            free -m | head -3
            df -h / "$ROOT" 2>/dev/null | tail -2
            echo "tp/scripts present:"
            ls tp/scripts 2>/dev/null | head -20
            echo "on-device prefix contract in the clone:"
            grep -rn "TERMUX_PREFIX.*termux-build\|Building on-device\|On-device builds" tp/scripts/build/*.sh tp/build-package.sh 2>/dev/null | head -10
            [ -e tp/build/packages/libandroid-glob ] && du -sh tp/build/packages/libandroid-glob
          } | tee -a "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
