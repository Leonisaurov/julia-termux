name: probe-juliac-memory

# One question: can the `julia --output-o` step that juliac needs be made to fit in
# a phone's free RAM?
#
# Measured so far (probe-juliac-binary, runs 38019909461 and 38021823582): our
# artifact peaks at 7.30 GB for a hello world on ubuntu-24.04-arm, upstream aarch64
# at 6.12 GB, and the phone dies at 6.45 GB with Android sharing its ~7.5 GB.  The
# phone therefore needs a variant that lands under ~5 GB to have any margin.
#
# The levers were measured in two passes of this matrix (runs 38068408208 and
# 38069023593), peak RSS for the same hello world on the same artifact:
#
#   baseline        6.83-6.86 GB  2:37-2:40  rc=0  212 MB binary, runs
#   heaphint-2g     6.84-6.90 GB  2:41-2:43  rc=0  212 MB binary, runs
#   o0              8.81-8.86 GB  2:03-2:07  rc=0  226 MB binary, runs
#   trim-safe       0.41 GB       0:07       rc=1  no binary
#   incremental     0.41 GB       0:05       rc=1  no binary
#
# So two levers are closed and one is still open:
#   -O0            makes the peak *worse*, not better, while shortening wall time.
#                  That is consistent with the phone, where the -O0 run died too.
#   --heap-size-hint moves Julia's own heap and nothing else.  The phone's failure
#                  was a C++ bad_alloc out of LLVM, so this was the expected null.
#   --output-incremental  blocked by juliac itself: its buildscript creates the
#                  global `task` in Main and incremental compilation stops with
#                  "Creating a new global in closed module `Main` (`task`) breaks
#                  incremental compilation".
#   --trim         the only open one, and the only that would matter: it failed at
#                  0.41 GB after 7 s, i.e. before doing the memory-hungry part, with
#                  a program that is already trim-friendly (`print("HOLA\n")`, no
#                  varargs - the first pass used `println("…", VERSION)` and --trim
#                  refused that, which is a property of that hello world).
#
# This pass is therefore trim only, and it dumps the whole driver log (the message
# sits in the middle and a head/tail window missed it twice).
#
# workflow_dispatch only: build-package.yml's push trigger filters on paths that do
# not list this file.
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  JULIA_DEB: julia_1.12.6_aarch64.deb
  # The artifact republished with bin/juliac (run 38026064025, "Build Julia for
  # Termux"): the release tag is mutable, so the hash is what makes this the
  # artifact every job in this matrix measured.
  JULIA_DEB_SHA256: b1f0ecfa6344120b7b26cafa57ac0522f4e88aa88de05886aa5b4fc5c8dcb960

jobs:
  variant:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          # The program no longer touches Base's IO.  Every trim failure so far was
          # "unresolved call ... Base.print(Base.stdout::IO, x::Any)", i.e. printing
          # goes through Any and trim cannot prove it.  ccall(:write) does not, so
          # this asks the last question: does trimming fit the phone when the program
          # itself is dispatch-free?  Both modes, because safe is the one upstream
          # supports if the verifier accepts it.
          - variant: write-unsafe-generic
            flags: "--experimental --trim=unsafe"
            extra: ""
            incremental: "0"
          - variant: write-safe-generic
            flags: "--experimental --trim=safe"
            extra: ""
            incremental: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Machine capabilities
        run: |
          set -uo pipefail
          nproc
          free -m
          awk '/MemTotal|MemAvailable|CommitLimit|Committed_AS/' /proc/meminfo

      - name: Raise the runner's mapping limit
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          sudo sysctl -w vm.max_map_count=1048576

      - name: Materialise the Termux prefix (the build's own code path)
        uses: ./.github/actions/termux-builder
        with:
          recipe: packages/julia/build.sh

      - name: Install OUR julia
        run: |
          set -euo pipefail
          ROOT=/data/data/com.termux/files/usr
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/julia-latest/${JULIA_DEB}" \
            -o "$RUNNER_TEMP/$JULIA_DEB"
          echo "${JULIA_DEB_SHA256}  $RUNNER_TEMP/$JULIA_DEB" | sha256sum -c -
          sudo dpkg-deb -x "$RUNNER_TEMP/$JULIA_DEB" /
          sudo chown -R "$(id -u):$(id -g)" /data
          sudo chmod -R a+rX /data
          # The libm shim a device always has (bootstrap symlink + Android's namespace
          # config).  Without it the artifact cannot print its version here.
          for d in "$ROOT/lib/julia" "$ROOT/lib"; do
            if [ ! -e "$d/libm.so" ]; then ln -sfn /system/lib64/libm.so "$d/libm.so"; fi
          done
          "$ROOT/bin/julia" --version

      - name: Patch the driver for this variant
        env:
          EXTRA: ${{ matrix.extra }}
          INCREMENTAL: ${{ matrix.incremental }}
        run: |
          set -euo pipefail
          ROOT=/data/data/com.termux/files/usr
          DRIVER="$ROOT/share/julia/juliac/juliac.jl"
          python3 - "$DRIVER" <<'PY'
          import os, sys
          path = sys.argv[1]
          src = open(path).read()
          extra = os.environ.get("EXTRA", "").strip()
          incr = os.environ.get("INCREMENTAL", "0") == "1"
          if extra:
              anchor = 'isnothing(outname) && error("No output file specified")'
              assert anchor in src, "driver does not look like juliac.jl"
              src = src.replace(anchor, f'append!(julia_args, [{extra}])\n' + anchor, 1)
              print(f"patched: append!(julia_args, [{extra}])")
          if incr:
              old = "--output-incremental=no"
              assert old in src, "the incremental flag is not where it was"
              src = src.replace(old, "--output-incremental=yes", 1)
              print("patched: --output-incremental=no -> yes")
          if not (extra or incr):
              print("no patch: this variant is a command-line flag away")
          open(path, "w").write(src)
          PY
          grep -n 'output-incremental\|append!(julia_args' "$DRIVER" | head -3

      - name: hello.jl
        run: |
          set -euo pipefail
          mkdir -p work
          cat > work/hello.jl <<'EOF'
          function (@main)(args::Vector{String})
              msg = "HOLA desde un binario trimmed\n"
              n = ccall(:write, Cint, (Cint, Ptr{UInt8}, Csize_t), 1, msg, sizeof(msg) - 1)
              return n == sizeof(msg) - 1 ? Cint(0) : Cint(1)
          end
          EOF

      - name: juliac ${{ matrix.variant }}, measured
        working-directory: work
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          set -uo pipefail
          ROOT=/data/data/com.termux/files/usr
          export PATH="$ROOT/bin:$PATH" TMPDIR="$ROOT/tmp"
          # Pkg answers a depot with no registry by installing one, and bionic has no
          # DNS here, so the registry comes from the host's git (see the sibling
          # probe) and offline keeps the driver out of the network.
          export JULIA_PKG_OFFLINE=true
          # The runner is a neoverse-n2; the phone refuses that code with
          # "Rejecting this target due to use of runtime-disabled features".
          export JULIA_CPU_TARGET=generic
          if [ ! -d "$HOME/.julia/registries/General" ]; then
            mkdir -p "$HOME/.julia/registries"
            /usr/bin/git clone --depth 1 --quiet \
              https://github.com/JuliaRegistries/General.git \
              "$HOME/.julia/registries/General"
          fi
          rc=0
          # shellcheck disable=SC2086
          /usr/bin/time -v "$ROOT/bin/julia" "$ROOT/share/julia/juliac/juliac.jl" \
            $FLAGS --output-exe hello hello.jl > juliac.log 2>&1 || rc=$?
          peak=$(sed -n 's/.*Maximum resident set size (kbytes): \([0-9]*\).*/\1/p' juliac.log | tail -1)
          wall=$(sed -n 's/^[[:space:]]*Elapsed (wall clock) time.*: \([0-9:.]*\)$/\1/p' juliac.log | tail -1)
          echo "variant=${{ matrix.variant }} rc=$rc peak_kb=${peak:-?} wall=${wall:-?}"
          # The whole log when it is small enough: a trim failure prints its message
          # in the middle, and the head/tail window missed it twice.
          bytes=$(wc -c < juliac.log)
          echo "juliac.log is $bytes bytes"
          if [ "$bytes" -le 20000 ]; then
            echo '----- juliac.log -----'
            cat juliac.log
            echo '----- end -----'
          else
            echo '----- juliac.log head -----'
            head -c 6000 juliac.log
            echo '----- juliac.log tail -----'
            tail -c 3000 juliac.log
          fi
          size="-"
          runs="no binary"
          if [ -x ./hello ]; then
            size=$(stat -c %s ./hello)
            if ./hello > run.log 2>&1; then runs="yes: $(head -1 run.log)"; else
              runs="no (rc=$?): $(cat run.log | head -3 | tr '\n' ' ')"
            fi
          fi
          {
            echo "| ${{ matrix.variant }} | ${peak:-?} KB | ${wall:-?} | rc=$rc | $size B | $runs |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SUMMARY_ROW ${{ matrix.variant }} peak_kb=${peak:-?} wall=${wall:-?} rc=$rc size=$size runs=$runs"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: juliac-${{ matrix.variant }}
          path: work/hello
          if-no-files-found: warn
          retention-days: 7
