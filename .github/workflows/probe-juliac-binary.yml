name: probe-juliac-binary

# Feasibility probe, not a build.  It answers one question: does `juliac --output-exe`
# fail on this phone because the phone runs out of RAM, or because of OUR build?
#
# The upstream half is already answered (run 38019909461, the previous version of this
# file): the official 1.12.6 tarball produced a working binary on both runners -
# 4.48 GB peak RSS on x86_64, 6.12 GB on aarch64, ~2:30 wall - while the phone reached
# 6.45 GB and died with std::bad_alloc.  So juliac is not broken; it needs about
# 6.1-6.5 GB, and the phone has 7.3 GB that Android shares with everything else.
#
# What is still open is whether OUR artifact needs the same or more.  So this runs the
# published julia-latest .deb - the same bytes device-smoke.sh took to 19 pass / 0 fail -
# inside a materialised Termux prefix on a runner that has the RAM the phone lacks.
# Nothing is compiled: the prefix comes from the termux-builder action, which is the
# same code path the package build uses.
#
# workflow_dispatch only on purpose: build-package.yml triggers on push with a paths:
# filter that does not list this file, so committing it does not rebuild the package.
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Pinned, not "latest": the release tag is mutable, so the hash is what makes this
  # the artifact the device validated rather than whatever was published last.
  JULIA_DEB: julia_1.12.6_aarch64.deb
  JULIA_DEB_SHA256: 384597fe2f9012e60a8851f995e48028c6876d9d8ecbbf147a2e5c08d0ccd9df

jobs:
  probe:
    name: juliac with our artifact
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Machine capabilities
        run: |
          set -uo pipefail
          uname -m
          nproc
          free -m
          df -h / | tail -1
          awk '/MemTotal|MemAvailable|CommitLimit|Committed_AS/' /proc/meminfo

      # Cheap insurance, not a hypothesis: bionic's scudo refuses a mapping for the
      # same message whether the kernel is out of RAM or out of VMAs, and the phone
      # cannot show /proc/sys/vm/max_map_count to compare.  Neither can change the
      # artifact being measured.
      - name: Raise the runner's mapping limit
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "max_map_count before: $(cat /proc/sys/vm/max_map_count)"
          sudo sysctl -w vm.max_map_count=1048576
          echo "max_map_count after:  $(cat /proc/sys/vm/max_map_count)"

      - name: Add compressed swap to the runner
        uses: ./.github/actions/zram
        continue-on-error: true

      - name: Materialise the Termux prefix (the build's own code path)
        uses: ./.github/actions/termux-builder
        with:
          recipe: packages/julia/build.sh

      - name: Install OUR julia
        run: |
          set -euo pipefail
          ROOT=/data/data/com.termux/files/usr
          # The host's curl deliberately: LD_PRELOAD is not set in this step, and
          # inside the prefix bionic's resolver has no DNS on these runners.
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/julia-latest/${JULIA_DEB}" \
            -o "$RUNNER_TEMP/$JULIA_DEB"
          echo "${JULIA_DEB_SHA256}  $RUNNER_TEMP/$JULIA_DEB" | sha256sum -c -
          sudo dpkg-deb -x "$RUNNER_TEMP/$JULIA_DEB" /
          # The deb's members carry the phone prefix's 0700 modes; hand them to the
          # runner user instead of widening them.
          sudo chown -R "$(id -u):$(id -g)" /data
          sudo chmod -R a+rX /data
          # Never `ls … | head` in a step that runs under `set -o pipefail`: head
          # leaves at its last line, ls takes SIGPIPE and the step dies with 141/2
          # on a listing that was perfectly fine (the same shape as the readelf
          # SIGPIPE this repository already lost a `make install` to).  `wc -l`
          # reads the stream to the end, so it cannot.
          echo "prefix bin entries: $(ls "$ROOT/bin" | wc -l)"
          echo '--- our julia ---'
          ls -l "$ROOT/bin/julia"

      - name: Give the prefix the libm shim a device always has
        run: |
          set -euo pipefail
          ROOT=/data/data/com.termux/files/usr
          # DEP_LIBS inside libjulia.so is `julia/libm.so:@julia/libstdc++.so.6:...`,
          # so the loader asks for $PREFIX/lib/julia/libm.so.  On a device that
          # name is answered by the platform: bionic resolves libm.so through the
          # generated namespace config, and the prefix carries
          # $PREFIX/lib/libm.so -> /system/lib64/libm.so, which no .deb owns
          # (it arrives with the Termux bootstrap - the file on this phone is
          # dated with the other bootstrap symlinks, and `pacman -Qo` reports no
          # owner).  A prefix materialised from .debs alone has neither, so the
          # artifact cannot even print its version:
          #   ERROR: Unable to load dependent library .../lib/julia/libm.so
          # Both candidates are given the name they ask for.  Nothing is
          # shadowed: the guard skips any name the closure already provides.
          for d in "$ROOT/lib/julia" "$ROOT/lib"; do
            if [ ! -e "$d/libm.so" ]; then
              ln -sfn /system/lib64/libm.so "$d/libm.so"
            fi
          done
          ls -l "$ROOT/lib/julia/libm.so" "$ROOT/lib/libm.so"

      - name: What the artifact ships (is there a bin/juliac?)
        run: |
          set -uo pipefail
          ROOT=/data/data/com.termux/files/usr
          # PATH and TMPDIR only: no LD_PRELOAD.  libtermux-exec exists to rewrite
          # /bin, /etc, /lib, /usr and /var paths for build scripts; with absolute
          # paths it is not needed, and preloading a bionic library into the runner's
          # own glibc tools is what makes them abort with "invalid ELF header".
          export PATH="$ROOT/bin:$PATH" TMPDIR="$ROOT/tmp"
          echo "--- julia --version ---"
          # `|| rc=$?` and not a bare command followed by `echo $?`: every run block is
          # executed by `bash -e`, so a bare failure aborts the step right there and the
          # diagnostic never prints - which is how this probe's first juliac step managed
          # to fail with rc=1 and no output at all (the lint's own warning).
          rc=0
          "$ROOT/bin/julia" --version || rc=$?
          echo "julia --version rc=$rc"
          if [ -e "$ROOT/bin/juliac" ]; then
            echo "bin/juliac: PRESENT -> $(ls -l "$ROOT/bin/juliac")"
          else
            echo "bin/juliac: absent (this artifact predates the launcher commit) - the"
            echo "            driver is invoked through the shipped script, as on the phone"
          fi
          echo "--- share/julia/juliac ---"
          ls "$ROOT/share/julia/juliac/" || echo "(absent)"

      - name: hello.jl
        run: |
          set -euo pipefail
          mkdir -p work
          cat > work/hello.jl <<'EOF'
          function (@main)(args::Vector{String})
              println("HOLA desde un binario nativo — Julia ", VERSION)
              println("args = ", args)
              return 0
          end
          EOF
          cat work/hello.jl

      - name: juliac --output-exe, measured
        working-directory: work
        run: |
          set -uo pipefail
          ROOT=/data/data/com.termux/files/usr
          # juliac's first act is `Pkg.precompile()` in a second process, and Pkg
          # answers a depot with no registries by cloning
          # https://github.com/JuliaRegistries/General.git.  From inside bionic there
          # is no DNS on these runners (the termux-builder action documents it and
          # routes every fetch through the host's curl), so that clone fails and the
          # driver exits before compiling anything:
          #   ERROR: failed to clone from .../General.git
          #   failed to resolve address for github.com: No address associated with hostname
          # Offline says the same thing the environment already says, and the phone
          # passes this step only because it does have a resolver.
          export JULIA_PKG_OFFLINE=true
          export PATH="$ROOT/bin:$PATH" TMPDIR="$ROOT/tmp"
          echo "JULIA_PKG_OFFLINE=$JULIA_PKG_OFFLINE"
          # Offline is not enough on its own: Pkg answers a depot with *no* registry
          # by installing one, and that install is the clone above - it happens
          # before offline is consulted.  The phone's depot carries the registry
          # (~/.julia/registries/General.tar.gz + General.toml), so give this depot
          # the same thing, fetched with the host's git, which does resolve names.
          # The environment has no packages, so this registry is never searched;
          # it is here so the driver's precompile step finds a registry present.
          if [ ! -d "$HOME/.julia/registries/General" ]; then
            mkdir -p "$HOME/.julia/registries"
            # /usr/bin/git and not `git`: PATH already has $PREFIX/bin first, so a bare
            # name resolves to the prefix's bionic git - the same one the closure
            # installed as a build dep - and that one has no resolver either.  The
            # host's glibc git answers github because nothing preloads libtermux-exec
            # in this step.  (First attempt called `git` and got exit 128.)
            /usr/bin/git clone --depth 1 --quiet \
              https://github.com/JuliaRegistries/General.git \
              "$HOME/.julia/registries/General"
          fi
          ls -ld "$HOME/.julia/registries/General"
          # The same command the phone ran, so the two numbers are comparable:
          # /usr/bin/time -v around `julia share/julia/juliac/juliac.jl`.  Output goes to
          # the log, so the failure has to be captured here or it is invisible.
          rc=0
          /usr/bin/time -v "$ROOT/bin/julia" "$ROOT/share/julia/juliac/juliac.jl" \
            --output-exe hello hello.jl > juliac.log 2>&1 || rc=$?
          echo "juliac rc=$rc"
          echo "===== tail of juliac.log ====="
          tail -c 4000 juliac.log
          echo "===== measurement ====="
          grep -E 'Maximum resident set size|Elapsed \(wall clock\)|Exit status' juliac.log \
            || echo "(no measurement was produced)"
          echo "===== products ====="
          ls -la
          if [ -x ./hello ]; then
            echo "===== THE BINARY RUNS ====="
            ./hello alfa beta || echo "binary exited $?"
            file ./hello
            {
              echo "### our artifact on ubuntu-24.04-arm: **succeeded**"
              echo
              echo '```'
              grep -E 'Maximum resident set size|Elapsed \(wall clock\)' juliac.log || true
              file ./hello
              echo '```'
              echo "Upstream aarch64 for comparison: 6.12 GB peak, 2:30 wall."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "===== NO BINARY: rc=$rc ====="
            {
              echo "### our artifact on ubuntu-24.04-arm: **failed** (rc=$rc)"
              echo
              echo '```'
              tail -c 1500 juliac.log
              echo '```'
              echo "Upstream aarch64 built it at 6.12 GB peak - if this failed, the"
              echo "difference is the artifact, not the RAM."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # A failure here is a result, so it must not be reported as the job's
          # failure: the log is the answer.
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: juliac-binary-our-artifact
          path: work/hello
          if-no-files-found: warn
          retention-days: 7
