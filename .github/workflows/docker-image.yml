name: Docker image

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/Dockerfile'
      - 'scripts/setup-ubuntu.sh'
      - 'scripts/setup-android-sdk.sh'
      - '.github/workflows/docker-image.yml'
      - '.github/actions/zram/**'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Enable zram swap
      uses: ./.github/actions/zram

    - name: Set lowercase owner
      run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build
      uses: docker/build-push-action@v5
      with:
        context: scripts/
        load: true
        tags: ghcr.io/${{ env.OWNER }}/package-builder:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # The Julia build consumes the official Termux builder image directly.
    # Keep this workflow as a local validation; publishing to GHCR requires
    # package ownership configuration outside this repository.
