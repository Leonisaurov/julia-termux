name: Build Julia for Termux

on:
  push:
    branches: [main]
    paths:
      - 'packages/julia/**'
      - 'packages/termux-keyring/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Enable zram
      uses: ./.github/actions/zram
      with:
        algorithm: zstd
        size: 16G
        priority: 100
        device_name: /dev/zram0

    - name: Restore build cache
      uses: actions/cache@v4
      id: build-cache
      with:
        path: ~/.termux-build
        key: julia-build-${{ hashFiles('packages/julia/build.sh') }}-${{ github.run_id }}
        restore-keys: |
          julia-build-${{ hashFiles('packages/julia/build.sh') }}-
          julia-build-

    - name: Check cache size
      run: |
        echo "Cache size: $(du -sh ~/.termux-build 2>/dev/null | cut -f1 || echo '0')"
        echo "LLVM libs: $(ls ~/.termux-build/julia/_cache/libLLVM* 2>/dev/null | wc -l) files"

    - name: Prepare cache directory
      run: mkdir -p ~/.termux-build

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq

    - name: Install system dependencies
      env:
        TERMUX_DOCKER_RUN_EXTRA_ARGS: --volume /home/runner/.termux-build:/home/builder/.termux-build
      run: ./scripts/run-docker.sh bash ./scripts/install-deps.sh

    - name: Build Julia
      env:
        TERMUX_DOCKER_RUN_EXTRA_ARGS: --volume /home/runner/.termux-build:/home/builder/.termux-build
      run: ./scripts/run-docker.sh ./build-package.sh -Q -s -a aarch64 --format pacman julia

    - name: Debug - Show build log on failure
      if: failure()
      run: |
        echo "=== Build failed - collecting debug info ==="
        ls -la ~/.termux-build/ 2>/dev/null || echo "No .termux-build dir"
        find ~/.termux-build -name "*.log" -o -name "*.err" 2>/dev/null | head -20
        cat ~/.termux-build/julia/config.log 2>/dev/null || echo "No config.log"
        echo "=== Last 100 lines of build log ==="
        find ~/.termux-build -name "*.log" -exec tail -100 {} \; 2>/dev/null || true

    - name: Collect package files
      if: always()
      run: |
        mkdir -p ./artifacts
        ls -la output/ 2>/dev/null || echo "(output/ empty)"
        mv output/*.pkg.tar.* ./artifacts/ 2>/dev/null && echo "Packages collected" || echo "No packages found"

    - name: Upload to GitHub Release
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        FILE=$(ls ./artifacts/*.pkg.tar.* 2>/dev/null | head -1)
        [ -f "$FILE" ] || exit 0
        gh release delete julia-latest --yes --cleanup-tag 2>/dev/null || true
        gh release create julia-latest "$FILE" \
          --repo "${{ github.repository }}" \
          --title "julia-latest" \
          --latest \
          --notes "Julia ${{ github.sha }} for Termux aarch64"

    - name: Store package files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: julia-aarch64-${{ github.sha }}
        path: ./artifacts/*
        if-no-files-found: warn
