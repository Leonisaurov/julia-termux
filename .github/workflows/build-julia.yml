name: Build Julia for Termux

on:
  push:
    branches: [main]
    paths:
      - 'packages/julia/**'
      - 'packages/termux-keyring/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Enable zram
      uses: ./.github/actions/zram
      with:
        algorithm: zstd
        size: 16G
        priority: 100
        device_name: /dev/zram0

    - name: Restore build cache
      uses: actions/cache@v4
      id: build-cache
      with:
        path: ~/.termux-build
        key: julia-${{ hashFiles('packages/julia/build.sh') }}
        restore-keys: |
          julia-

    - name: Prepare cache directory
      run: mkdir -p ~/.termux-build

    - name: Install QEMU for ARM binary execution
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq qemu-user-static binfmt-support
        # Asegurar que binfmt_misc está registrado para aarch64
        if [ -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
          echo "QEMU binfmt already registered:"
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64
        else
          echo "Registering QEMU binfmt for aarch64..."
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true
          # Fallback: registro manual
          if [ ! -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo ':aarch64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-aarch64-static:F' | sudo tee /proc/sys/fs/binfmt_misc/register 2>/dev/null || true
          fi
        fi
        echo "BFIFMT STATUS:"
        ls -la /proc/sys/fs/binfmt_misc/ 2>/dev/null | grep -E "qemu|register" || echo "(no binfmt_misc entries)"

    - name: Install system dependencies
      env:
        TERMUX_DOCKER_RUN_EXTRA_ARGS: --volume /home/runner/.termux-build:/home/builder/.termux-build
      run: ./scripts/run-docker.sh bash ./scripts/install-deps.sh

    - name: Build Julia
      env:
        TERMUX_DOCKER_RUN_EXTRA_ARGS: --volume /home/runner/.termux-build:/home/builder/.termux-build
      run: ./scripts/run-docker.sh ./build-package.sh -s -a aarch64 --format pacman julia

    - name: Collect package files
      if: always()
      run: |
        echo "=== Checking output/ directory ==="
        ls -la output/ 2>/dev/null || echo "(output/ empty or missing)"
        echo "=== Looking for pacman packages ==="
        PKG_COUNT=$(ls output/*.pkg.tar.* 2>/dev/null | wc -l)
        echo "Found $PKG_COUNT package(s)"
        mkdir -p ./artifacts
        if [ "$PKG_COUNT" -gt 0 ]; then
          ls -la output/*.pkg.tar.*
          mv output/*.pkg.tar.* ./artifacts/
          echo "=== Artifacts collected ==="
          ls -la ./artifacts/
        else
          echo "WARNING: No .pkg.tar.* files found in output/"
        fi

    - name: Upload to GitHub Release
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        FILE=$(ls ./artifacts/*.pkg.tar.* 2>/dev/null | head -1)
        if [ -z "$FILE" ]; then
          echo "WARNING: No package file to upload to release"
          exit 0
        fi
        echo "Uploading $FILE to GitHub Release"
        gh release delete julia-latest --yes --cleanup-tag 2>/dev/null || true
        gh release create julia-latest "$FILE" \
          --repo "${{ github.repository }}" \
          --title "julia-latest" \
          --latest \
          --notes "Julia ${{ github.sha }} for Termux aarch64"

    - name: Store package files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: julia-aarch64-${{ github.sha }}
        path: ./artifacts/*
        if-no-files-found: warn
